<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>El barrio manda</title>
  <style>
    /* estilo simple y centrado */
    html,body{
      height:100%;
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#111;
      color:#fff;
    }
    .container{
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:20px;
      padding:20px;
      box-sizing:border-box;
      text-align:center;
    }
    img{
      max-width:90%;
      height:auto;
      border-radius:8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .texto{
      font-size:2rem;
      font-weight:700;
      letter-spacing:1px;
      text-transform:lowercase;
      background: linear-gradient(90deg, #ffd54a, #ff7043);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @media (min-width:700px){
      .texto{ font-size:3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Opción A: usar una imagen local llamada "futbol.jpg" -->
    <!-- <img src="futbol.jpg" alt="Balón de fútbol"> -->

    <!-- Opción B: usar una imagen desde internet (ejemplo gratuito) -->
    <img src="https://images.unsplash.com/photo-1517927033932-b3d6e0e7b2c8?q=80&w=1600&auto=format&fit=crop&ixlib=rb-4.0.3&s=placeholder" alt="Imagen de fútbol (balón en césped)">

    <div class="texto">el barrio manda</div>
  </div>
</body>
</html>
