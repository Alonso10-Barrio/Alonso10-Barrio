<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>El barrio manda</title>
  <style>
    html,body{
      height:100%;
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#111;
      color:#fff;
    }
    .container{
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:20px;
      padding:20px;
      text-align:center;
      box-sizing:border-box;
    }
    img{
      max-width:90%;
      height:auto;
      border-radius:8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .texto{
      font-size:2rem;
      font-weight:700;
      letter-spacing:1px;
      text-transform:lowercase;
      background: linear-gradient(90deg, #ffd54a, #ff7043);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @media (min-width:700px){
      .texto{ font-size:3rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Esta es la imagen que me pasaste -->
    <img src="futbol.jpg" alt="Foto de un partido de fútbol juvenil">

    <div class="texto">el barrio manda</div>
  </div>
</body>
</html>
